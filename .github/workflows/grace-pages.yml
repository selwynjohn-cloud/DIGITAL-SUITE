name: Deploy Grace Vision page
on:
  push:
    branches: [main, cursor/grace-vision-mission-9988]
    paths:
      - "grace-and-care/**"
      - ".github/workflows/grace-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp grace-and-care/index.html _site/
          cp grace-and-care/preview-vision-mission.html _site/ || true
          cp grace-and-care/vercel.json _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
